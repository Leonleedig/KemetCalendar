<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>反向日晷天球儀 · 極簡黑白線稿版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { user-select: none; -webkit-user-select: none; margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff; color: #09090b;
    }
    body.theme-night, body.theme-day { background-color: #ffffff; color: #09090b; }
    canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }
    .astronomy-title { font-family: 'Cinzel', serif; letter-spacing: 0.15em; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.94) !important;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid #09090b !important;
      box-shadow: 6px 6px 0px rgba(9, 9, 11, 0.9) !important;
      color: #09090b !important;
      transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .custom-slider {
      -webkit-appearance: none; appearance: none;
      background: #d4d4d8; border: 1px solid #09090b; border-radius: 9999px;
      outline: none; height: 6px; transition: opacity 0.2s ease;
    }
    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: #ffffff; cursor: grab; border: 2.5px solid #09090b;
      box-shadow: 2px 2px 0px #09090b; opacity: 1 !important;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .custom-slider:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.2); background: #09090b; }
    .custom-slider::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: #ffffff; cursor: grab; border: 2.5px solid #09090b;
      box-shadow: 2px 2px 0px #09090b; opacity: 1 !important;
    }
    .panel-dragging {
      opacity: 0.05 !important; backdrop-filter: blur(0px) !important;
      -webkit-backdrop-filter: blur(0px) !important;
      border-color: transparent !important; box-shadow: none !important;
    }
    .panel-dragging .slider-thumb-keep { opacity: 1 !important; }
    #north-indicator-hud {
      position: absolute; top: 24px; right: 24px;
      height: 10vh; width: 10vh; min-height: 48px; min-width: 48px;
      pointer-events: auto; cursor: pointer; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #09090b; transition: opacity 0.5s ease, transform 0.2s ease;
    }
    #north-indicator-hud:hover { transform: scale(1.08); }
    #north-indicator-hud:active { transform: scale(0.94); }
    #north-indicator-hud svg { width: 100%; height: 100%; transform-origin: center center; }
    .btn-reset-contrast {
      border: 1.5px solid #09090b !important; background-color: #ffffff !important;
      color: #09090b !important; box-shadow: 2px 2px 0px #09090b;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.15s ease;
    }
    .btn-reset-contrast:hover {
      transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #09090b; background-color: #f4f4f5 !important;
    }
    .btn-reset-contrast:active { transform: translate(1px, 1px); box-shadow: 0 0 0 #09090b; }
    .tutorial-overlay { pointer-events: auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .tutorial-highlight {
      position: relative; z-index: 60 !important;
      box-shadow: 0 0 0 3px #09090b, 6px 6px 0px #09090b !important;
      transition: box-shadow 0.3s ease;
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .animate-pulse-subtle { animation: pulse-subtle 2s infinite ease-in-out; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #09090b; border-radius: 9999px; }
  </style>
</head>
<body class="relative w-full h-full theme-day">

  <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

  <!-- Tutorial Modal -->
  <div id="tutorial-modal" class="fixed top-8 left-1/2 -translate-x-1/2 z-50 w-[92vw] max-w-lg glass-panel rounded-2xl p-5 transition-all duration-300">
    <div class="flex items-center justify-between pb-3 border-b border-black/20">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-black animate-ping"></span>
        <span id="tut-step-badge" class="text-[11px] font-mono font-bold px-2.5 py-0.5 rounded-full border border-black bg-black text-white">步驟 1 / 6</span>
      </div>
      <button id="btn-skip-tutorial" class="text-xs font-semibold hover:bg-black hover:text-white transition px-2.5 py-1 rounded-lg border border-black">省略示範 ✕</button>
    </div>
    <div class="py-4">
      <h3 id="tut-title" class="font-bold text-base tracking-wide mb-1.5 flex items-center gap-2 text-black"><span>🔄</span> 探索視角與天球位姿</h3>
      <p id="tut-desc" class="text-xs text-zinc-700 leading-relaxed min-h-[38px]">在畫面上任意滑動、拖曳可旋轉觀測天球視角；滾輪或雙指可縮放距離。</p>
    </div>
    <div class="flex items-center justify-between pt-2 border-t border-black/20">
      <div class="flex items-center gap-1.5" id="tut-dots">
        <span class="w-2 h-2 rounded-full bg-black"></span>
        <span class="w-2 h-2 rounded-full bg-black/20"></span>
        <span class="w-2 h-2 rounded-full bg-black/20"></span>
        <span class="w-2 h-2 rounded-full bg-black/20"></span>
        <span class="w-2 h-2 rounded-full bg-black/20"></span>
        <span class="w-2 h-2 rounded-full bg-black/20"></span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-prev-tutorial" class="hidden px-3 py-1.5 rounded-xl border border-black text-xs font-semibold hover:bg-zinc-100 transition">上一步</button>
        <button id="btn-next-tutorial" class="px-4 py-1.5 rounded-xl bg-black hover:bg-zinc-800 text-white font-semibold text-xs transition border border-black">下一步 ➔</button>
      </div>
    </div>
  </div>

  <!-- North Indicator -->
  <div id="north-indicator-hud" title="點擊重設視角：北方對齊上方、恢復預設比例">
    <svg id="north-arrow-svg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="#ffffff" fill-opacity="0.85" stroke="#09090b" stroke-width="2" stroke-dasharray="4, 3" />
      <polygon points="50,10 63,56 50,47 37,56" fill="#09090b" stroke="#09090b" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="50,90 61,54 50,60 39,54" fill="#ffffff" stroke="#09090b" stroke-width="1.5" stroke-linejoin="round" />
      <text x="50" y="39" font-family="'Cinzel', serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">N</text>
    </svg>
  </div>

  <!-- Control Panel -->
  <div id="control-panel" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 glass-panel rounded-2xl w-[92vw] max-w-md p-4 opacity-0 pointer-events-none scale-95 transition-all duration-300">
    <div class="space-y-4">
      <div class="flex items-center gap-3">
        <span class="text-xs font-mono font-bold w-16 shrink-0" id="label-lat">25.0° N</span>
        <div class="flex-1 flex items-center">
          <input type="range" id="slider-lat" min="-90" max="90" step="0.25" value="25.033" class="custom-slider slider-thumb-keep w-full">
        </div>
        <button id="btn-reset-lat" class="btn-reset-contrast w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold shrink-0" title="復位至當下緯度 (台北)">⟲</button>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-mono font-bold w-16 shrink-0" id="label-season">今日</span>
        <div class="flex-1 flex items-center">
          <input type="range" id="slider-season" min="-182" max="182" step="1" value="0" class="custom-slider slider-thumb-keep w-full">
        </div>
        <button id="btn-reset-season" class="btn-reset-contrast w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold shrink-0" title="復位至當下時節 (今天)">⟲</button>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-mono font-bold w-16 shrink-0" id="label-time">12:00</span>
        <div class="flex-1 flex items-center">
          <input type="range" id="slider-time" min="-12" max="12" step="0.1" value="0" class="custom-slider slider-thumb-keep w-full">
        </div>
        <button id="btn-reset-time" class="btn-reset-contrast w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold shrink-0" title="復位至當下現在時間">⟲</button>
      </div>
      <div class="flex items-center justify-center gap-4 pt-2 border-t border-black/20">
        <button id="btn-toggle-sun" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border-2 border-black text-xs font-bold transition bg-black text-white" title="切換太陽天體、軌跡與範圍"><span>☉</span><span>日</span></button>
        <button id="btn-toggle-moon" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border-2 border-black text-xs font-bold transition bg-black text-white" title="切換月亮天體、軌跡與範圍"><span>☽</span><span>月</span></button>
        <button id="btn-toggle-info" class="w-8 h-8 rounded-xl border-2 border-black hover:bg-zinc-100 transition flex items-center justify-center text-sm font-serif font-bold" title="展開／折疊座標日期儀表板">ⓘ</button>
      </div>
      <div id="info-dashboard" class="hidden pt-2 border-t border-black/20 space-y-2 text-xs font-mono">
        <div class="text-[11px] flex justify-between font-semibold">
          <span id="dash-datetime">2026-10-01 11:31</span>
          <span id="dash-season-term" class="underline font-bold">秋分帶</span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-[11px]">
          <div class="p-2 rounded-lg bg-white border border-black">
            <div class="font-bold">☉ 太陽</div>
            <div>高度: <span id="dash-sun-alt" class="font-bold">+00.0°</span></div>
            <div>方位: <span id="dash-sun-az" class="font-bold">000.0°</span></div>
          </div>
          <div class="p-2 rounded-lg bg-white border border-black">
            <div class="font-bold">☽ 月球</div>
            <div>高度: <span id="dash-moon-alt" class="font-bold">+00.0°</span></div>
            <div>方位: <span id="dash-moon-az" class="font-bold">000.0°</span></div>
          </div>
        </div>
        <div class="text-[10px] text-zinc-700 text-center font-semibold">
          月相: <span id="dash-moon-phase" class="font-bold text-black">望月</span> · 觀測緯度: <span id="dash-lat-val">25.0° N</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== Astro Engine ==========
    const Astro = {
      rad: Math.PI / 180,
      deg: 180 / Math.PI,
      toJulian(date) { return date.getTime() / 86400000 + 2440587.5; },
      toDaysSince2000(date) { return this.toJulian(date) - 2451545.0; },

      getSunPosition(date, lat, lng) {
        const d = this.toDaysSince2000(date);
        const L = (280.460 + 0.9856474 * d) % 360;
        const g = ((357.528 + 0.9856003 * d) % 360) * this.rad;
        const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * this.rad;
        const eps = (23.439 - 0.0000004 * d) * this.rad;
        const sinDec = Math.sin(eps) * Math.sin(lambda);
        const dec = Math.asin(sinDec);
        const cosDec = Math.cos(dec);
        const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
        const GMST0 = (18.697374558 + 24.06570982441908 * d) % 24;
        const ut = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
        const gmst = (GMST0 + ut * 1.00273790935) % 24;
        const lmst = (gmst + lng / 15 + 24) % 24;
        const hourAngle = lmst * 15 * this.rad - ra;
        const phi = lat * this.rad;
        const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * cosDec * Math.cos(hourAngle);
        const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
        const cosAz = (Math.sin(dec) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt) + 1e-7);
        let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
        if (Math.sin(hourAngle) > 0) az = 2 * Math.PI - az;
        return {
          altitude: alt * this.deg,
          azimuth: ((az * this.deg) + 180) % 360,
          declination: dec * this.deg
        };
      },

      getMoonPosition(date, lat, lng) {
        const d = this.toDaysSince2000(date);
        const L0 = 218.316 + 13.176396 * d;
        const M = (134.963 + 13.064993 * d) * this.rad;
        const F = (93.272 + 13.229350 * d) * this.rad;
        const l = (L0 + 6.289 * Math.sin(M)) * this.rad;
        const b = (5.128 * Math.sin(F)) * this.rad;
        const eps = 23.439 * this.rad;
        const sinDec = Math.sin(eps) * Math.sin(l) * Math.cos(b) + Math.cos(eps) * Math.sin(b);
        const dec = Math.asin(Math.max(-1, Math.min(1, sinDec)));
        const cosDec = Math.cos(dec);
        const y = Math.cos(eps) * Math.sin(l) * Math.cos(b) - Math.sin(eps) * Math.sin(b);
        const x = Math.cos(l) * Math.cos(b);
        const ra = Math.atan2(y, x);
        const GMST0 = (18.697374558 + 24.06570982441908 * d) % 24;
        const ut = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
        const lmst = (GMST0 + ut * 1.00273790935 + lng / 15 + 24) % 24;
        const hourAngle = lmst * 15 * this.rad - ra;
        const phi = lat * this.rad;
        const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * cosDec * Math.cos(hourAngle);
        const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
        const cosAz = (Math.sin(dec) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt) + 1e-7);
        let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
        if (Math.sin(hourAngle) > 0) az = 2 * Math.PI - az;
        const moonAge = ((date.getTime() / 86400000 - 2451550.1) % 29.530588853 + 29.530588853) % 29.530588853;
        const phaseFraction = (1 - Math.cos((moonAge / 29.530588853) * 2 * Math.PI)) / 2;
        return {
          altitude: alt * this.deg,
          azimuth: ((az * this.deg) + 180) % 360,
          declination: dec * this.deg,
          phaseFraction,
          moonAge
        };
      },

      toCartesian(altDeg, azDeg, radius) {
        const alt = altDeg * this.rad;
        const az = azDeg * this.rad;
        return new THREE.Vector3(
          radius * Math.cos(alt) * Math.sin(az),
          radius * Math.sin(alt),
          -radius * Math.cos(alt) * Math.cos(az)
        );
      }
    };

    // ========== State ==========
    const state = {
      lat: 25.0330,
      lng: 121.5654,
      seasonDayOffset: 0,
      timeHourOffset: 0,
      baseDate: new Date(),
      visibleLayers: { sun: true, moon: true },
      sunRadius: 56,
      moonRadius: 49,
      horizonRadius: 40,
      isControlPanelOpen: false,
      panelOpenTime: 0,
      cameraMoved: true
    };

    function getActiveDate() {
      const d = new Date(state.baseDate.getTime());
      if (state.seasonDayOffset) d.setDate(d.getDate() + state.seasonDayOffset);
      if (state.timeHourOffset) d.setMinutes(d.getMinutes() + Math.round(state.timeHourOffset * 60));
      return d;
    }

    // ========== Three.js Setup ==========
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 2500);
    camera.position.set(0, 42, 98);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xffffff, 1);
    container.appendChild(renderer.domElement);

    // ========== Edge Post-Processor (optimized traverse) ==========
    const EdgePostProcessor = {
      colorTarget: null,
      idTarget: null,
      idMaterialCache: new Map(),
      outlineMeshes: [],
      quadScene: new THREE.Scene(),
      quadCamera: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1),
      quadMaterial: null,

      getIdMaterial(id) {
        if (!this.idMaterialCache.has(id)) {
          const r = ((id * 67) % 251 + 1) / 255;
          const g = ((id * 131) % 251 + 1) / 255;
          const b = ((id * 199) % 251 + 1) / 255;
          this.idMaterialCache.set(id, new THREE.MeshBasicMaterial({
            color: new THREE.Color(r, g, b), side: THREE.DoubleSide
          }));
        }
        return this.idMaterialCache.get(id);
      },

      init(w, h, pr) {
        const width = Math.floor(w * pr);
        const height = Math.floor(h * pr);
        const depthTexture = new THREE.DepthTexture();
        depthTexture.type = THREE.UnsignedShortType;
        depthTexture.minFilter = THREE.NearestFilter;
        depthTexture.magFilter = THREE.NearestFilter;

        this.colorTarget = new THREE.WebGLRenderTarget(width, height, {
          minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat, depthTexture, depthBuffer: true
        });
        this.idTarget = new THREE.WebGLRenderTarget(width, height, {
          minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
          format: THREE.RGBAFormat, depthBuffer: true
        });

        this.quadMaterial = new THREE.ShaderMaterial({
          uniforms: {
            tDiffuse: { value: this.colorTarget.texture },
            tDepth: { value: this.colorTarget.depthTexture },
            tObjectId: { value: this.idTarget.texture },
            uResolution: { value: new THREE.Vector2(width, height) },
            uCameraNear: { value: camera.near },
            uCameraFar: { value: camera.far }
          },
          vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
          fragmentShader: `
            #include <packing>
            uniform sampler2D tDiffuse, tDepth, tObjectId;
            uniform vec2 uResolution;
            uniform float uCameraNear, uCameraFar;
            varying vec2 vUv;
            float getLinearDepth(vec2 c) {
              float z = texture2D(tDepth, c).x;
              if (z >= 0.9999) return 1.0;
              float viewZ = perspectiveDepthToViewZ(z, uCameraNear, uCameraFar);
              return viewZToOrthographicDepth(viewZ, uCameraNear, uCameraFar);
            }
            void main() {
              vec2 t = vec2(1.0/uResolution.x, 1.0/uResolution.y);
              float d00=getLinearDepth(vUv+t*vec2(-1,-1)), d01=getLinearDepth(vUv+t*vec2(-1,0)),
                    d02=getLinearDepth(vUv+t*vec2(-1,1)), d10=getLinearDepth(vUv+t*vec2(0,-1)),
                    d12=getLinearDepth(vUv+t*vec2(0,1)), d20=getLinearDepth(vUv+t*vec2(1,-1)),
                    d21=getLinearDepth(vUv+t*vec2(1,0)), d22=getLinearDepth(vUv+t*vec2(1,1));
              float gxD=-d00-2.*d01-d02+d20+2.*d21+d22;
              float gyD=-d00-2.*d10-d20+d02+2.*d12+d22;
              float depthEdge = sqrt(gxD*gxD + gyD*gyD);
              vec3 cC=texture2D(tObjectId,vUv).rgb, cL=texture2D(tObjectId,vUv+t*vec2(-1,0)).rgb,
                   cR=texture2D(tObjectId,vUv+t*vec2(1,0)).rgb, cT=texture2D(tObjectId,vUv+t*vec2(0,1)).rgb,
                   cB=texture2D(tObjectId,vUv+t*vec2(0,-1)).rgb;
              float idEdge = step(0.02, max(max(distance(cC,cL),distance(cC,cR)), max(distance(cC,cT),distance(cC,cB))));
              float edge = max(smoothstep(0.0025, 0.007, depthEdge), idEdge);
              vec4 base = texture2D(tDiffuse, vUv);
              float luma = dot(base.rgb, vec3(0.299, 0.587, 0.114));
              gl_FragColor = vec4(vec3(luma * (1.0 - edge)), 1.0);
            }`
        });
        this.quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.quadMaterial));
        this.refreshOutlineList();
      },

      refreshOutlineList() {
        this.outlineMeshes.length = 0;
        scene.traverse(obj => {
          if (obj.isMesh && !(obj.userData && obj.userData.noOutlinePass)) {
            this.outlineMeshes.push(obj);
          }
        });
      },

      resize(w, h, pr) {
        if (!this.colorTarget) return;
        const width = Math.floor(w * pr);
        const height = Math.floor(h * pr);
        this.colorTarget.setSize(width, height);
        this.idTarget.setSize(width, height);
        this.quadMaterial.uniforms.uResolution.value.set(width, height);
      },

      render() {
        renderer.setRenderTarget(this.colorTarget);
        renderer.setClearColor(0xffffff, 1);
        renderer.clear();
        renderer.render(scene, camera);

        const saved = [];
        for (let i = 0; i < this.outlineMeshes.length; i++) {
          const m = this.outlineMeshes[i];
          if (!m.visible) continue;
          saved.push([m, m.material]);
          m.material = this.getIdMaterial((m.userData && m.userData.componentId) || 1);
        }
        // temporarily hide lines
        const hiddenLines = [];
        scene.traverse(obj => {
          if ((obj.isLine || obj.isLineSegments) && obj.visible) {
            hiddenLines.push(obj);
            obj.visible = false;
          }
        });

        renderer.setRenderTarget(this.idTarget);
        renderer.setClearColor(0x000000, 1);
        renderer.clear();
        renderer.render(scene, camera);

        for (let i = 0; i < saved.length; i++) saved[i][0].material = saved[i][1];
        for (let i = 0; i < hiddenLines.length; i++) hiddenLines[i].visible = true;

        renderer.setRenderTarget(null);
        renderer.render(this.quadScene, this.quadCamera);
      }
    };

    // ========== Controls ==========
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 12;
    controls.maxDistance = 650;
    controls.target.set(0, 0, 0);
    controls.addEventListener('change', () => { state.cameraMoved = true; });

    const celestialGroup = new THREE.Group();
    scene.add(celestialGroup);

    // Horizon disc
    const dialRadius = state.horizonRadius;
    const dialDisc = new THREE.Mesh(
      new THREE.CircleGeometry(dialRadius, 64),
      new THREE.MeshBasicMaterial({
        color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.88,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
      })
    );
    dialDisc.rotation.x = -Math.PI / 2;
    dialDisc.userData.componentId = 1;
    celestialGroup.add(dialDisc);

    // Compass grid
    const compassGridGroup = new THREE.Group();
    for (let deg = 0; deg < 180; deg += 30) {
      const rad = deg * Astro.rad;
      const r = dialRadius * 0.98;
      const pts = [
        new THREE.Vector3(-r * Math.sin(rad), 0.02, -r * Math.cos(rad)),
        new THREE.Vector3( r * Math.sin(rad), 0.02,  r * Math.cos(rad))
      ];
      compassGridGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0xd4d4d8, transparent: true, opacity: 0.7 })
      ));
    }
    celestialGroup.add(compassGridGroup);

    // Horizon ring
    const horizonRing = new THREE.Mesh(
      new THREE.RingGeometry(dialRadius - 0.35, dialRadius + 0.35, 96),
      new THREE.MeshBasicMaterial({ color: 0x09090b, side: THREE.DoubleSide })
    );
    horizonRing.rotation.x = -Math.PI / 2;
    horizonRing.position.y = 0.03;
    horizonRing.userData.componentId = 2;
    celestialGroup.add(horizonRing);

    // Gnomon
    const gnomonHeight = 12;
    const gnomonGroup = new THREE.Group();
    const pinMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.22, 0.5, gnomonHeight, 24),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    pinMesh.position.y = gnomonHeight / 2;
    pinMesh.userData.componentId = 3;
    gnomonGroup.add(pinMesh);

    const tipMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.65, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    tipMesh.position.y = gnomonHeight;
    tipMesh.userData.componentId = 4;
    gnomonGroup.add(tipMesh);

    const baseMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(1.9, 2.5, 0.6, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    baseMesh.position.y = 0.3;
    baseMesh.userData.componentId = 5;
    gnomonGroup.add(baseMesh);
    celestialGroup.add(gnomonGroup);

    // North arrow
    const arrowHead = new THREE.Mesh(
      new THREE.ConeGeometry(1.0, 2.8, 16),
      new THREE.MeshBasicMaterial({ color: 0x09090b })
    );
    arrowHead.rotation.x = -Math.PI / 2;
    arrowHead.position.set(0, 0.08, -dialRadius * 0.92);
    arrowHead.userData.componentId = 6;
    celestialGroup.add(arrowHead);

    // Sun
    const sunGroup = new THREE.Group();
    const sunSphere = new THREE.Mesh(
      new THREE.SphereGeometry(2.3, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    sunSphere.userData.componentId = 7;
    sunGroup.add(sunSphere);

    const sunCorona = new THREE.Mesh(
      new THREE.TorusGeometry(3.4, 0.14, 16, 48),
      new THREE.MeshBasicMaterial({ color: 0x09090b })
    );
    sunCorona.userData.componentId = 8;
    sunGroup.add(sunCorona);
    sunGroup.add(new THREE.DirectionalLight(0xffffff, 1));
    celestialGroup.add(sunGroup);

    // Moon (cross-hatch shader)
    const moonShaderMat = new THREE.ShaderMaterial({
      uniforms: { uSunPosition: { value: new THREE.Vector3() } },
      vertexShader: `
        varying vec3 vNormal, vWorldPosition;
        void main() {
          vNormal = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPosition = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        uniform vec3 uSunPosition;
        varying vec3 vNormal, vWorldPosition;
        void main() {
          float dotNL = dot(normalize(vNormal), normalize(uSunPosition - vWorldPosition));
          if (dotNL >= 0.0) {
            gl_FragColor = vec4(1.0);
          } else {
            float h1 = mod(gl_FragCoord.x + gl_FragCoord.y, 5.0);
            float h2 = mod(gl_FragCoord.x - gl_FragCoord.y, 5.0);
            float ink = (h1 < 1.8 || h2 < 1.2) ? 0.08 : 0.85;
            gl_FragColor = vec4(vec3(ink), 1.0);
          }
        }`
    });
    const moonGroup = new THREE.Group();
    const moonSphere = new THREE.Mesh(new THREE.SphereGeometry(1.65, 36, 36), moonShaderMat);
    moonSphere.userData.componentId = 9;
    moonGroup.add(moonSphere);
    celestialGroup.add(moonGroup);

    // Shadow line
    const shadowLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.06, 0), new THREE.Vector3(0, 0.06, 0)]),
      new THREE.LineBasicMaterial({ color: 0x09090b, linewidth: 3 })
    );
    celestialGroup.add(shadowLine);

    // Trajectory & bands
    let sunTrajectoryMesh = null;
    let moonTrajectoryMesh = null;
    const seasonsBandGroup = new THREE.Group();
    seasonsBandGroup.userData.noOutlinePass = true;
    celestialGroup.add(seasonsBandGroup);
    const moonBandGroup = new THREE.Group();
    moonBandGroup.userData.noOutlinePass = true;
    celestialGroup.add(moonBandGroup);

    // ========== Geometry Helpers ==========
    function disposeObject(obj) {
      if (!obj) return;
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    }

    function clearGroup(group) {
      while (group.children.length) {
        const c = group.children[0];
        group.remove(c);
        disposeObject(c);
      }
    }

    function createClosedDiurnalLoop(calcFn, targetDate, radius, tubeRadius, componentId) {
      const points = [];
      const start = new Date(targetDate);
      start.setHours(0, 0, 0, 0);
      for (let i = 0; i <= 96; i++) {
        const t = new Date(start.getTime() + (i / 96) * 86400000);
        const c = calcFn(t, state.lat, state.lng);
        points.push(Astro.toCartesian(c.altitude, c.azimuth, radius));
      }
      const curve = new THREE.CatmullRomCurve3(points, true);
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 100, tubeRadius, 12, true),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      mesh.userData.componentId = componentId;
      return mesh;
    }

    function createDeclinationBoundaryLine(lat, decRad, radius, opacity) {
      const phi = lat * Astro.rad;
      const pts = [];
      for (let i = 0; i <= 96; i++) {
        const H = (i / 96) * Math.PI * 2;
        const sinAlt = Math.sin(phi) * Math.sin(decRad) + Math.cos(phi) * Math.cos(decRad) * Math.cos(H);
        const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
        const cosAz = (Math.sin(decRad) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt) + 1e-7);
        let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
        if (Math.sin(H) > 0) az = 2 * Math.PI - az;
        pts.push(Astro.toCartesian(alt * Astro.deg, ((az * Astro.deg) + 180) % 360, radius));
      }
      return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x09090b, transparent: true, opacity })
      );
    }

    function updateSeasonsBand(lat) {
      clearGroup(seasonsBandGroup);
      if (!state.visibleLayers.sun) return;

      const phi = lat * Astro.rad;
      const eps = 23.439 * Astro.rad;
      const wSeg = 72, hSeg = 8;
      const vertices = [];
      const indices = [];

      for (let j = 0; j <= hSeg; j++) {
        const dec = -eps + (j / hSeg) * (2 * eps);
        for (let i = 0; i <= wSeg; i++) {
          const H = (i / wSeg) * Math.PI * 2;
          const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
          const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
          const cosAz = (Math.sin(dec) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt) + 1e-7);
          let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
          if (Math.sin(H) > 0) az = 2 * Math.PI - az;
          const p = Astro.toCartesian(alt * Astro.deg, ((az * Astro.deg) + 180) % 360, state.sunRadius);
          vertices.push(p.x, p.y, p.z);
        }
      }
      for (let j = 0; j < hSeg; j++) {
        for (let i = 0; i < wSeg; i++) {
          const a = j * (wSeg + 1) + i;
          const b = (j + 1) * (wSeg + 1) + i;
          const c = (j + 1) * (wSeg + 1) + (i + 1);
          const d = j * (wSeg + 1) + (i + 1);
          indices.push(a, b, d, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      seasonsBandGroup.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color: 0x09090b, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false
      })));
      seasonsBandGroup.add(createDeclinationBoundaryLine(lat, eps, state.sunRadius, 0.35));
      seasonsBandGroup.add(createDeclinationBoundaryLine(lat, -eps, state.sunRadius, 0.35));
    }

    function updateMoonBand(lat) {
      clearGroup(moonBandGroup);
      if (!state.visibleLayers.moon) return;
      const maxDec = (23.439 + 5.145) * Astro.rad;
      moonBandGroup.add(createDeclinationBoundaryLine(lat, maxDec, state.moonRadius, 0.22));
      moonBandGroup.add(createDeclinationBoundaryLine(lat, -maxDec, state.moonRadius, 0.22));
    }

    function updateDiurnalTrajectories() {
      if (sunTrajectoryMesh) {
        celestialGroup.remove(sunTrajectoryMesh);
        disposeObject(sunTrajectoryMesh);
        sunTrajectoryMesh = null;
      }
      if (moonTrajectoryMesh) {
        celestialGroup.remove(moonTrajectoryMesh);
        disposeObject(moonTrajectoryMesh);
        moonTrajectoryMesh = null;
      }

      const activeDate = getActiveDate();
      if (state.visibleLayers.sun) {
        sunTrajectoryMesh = createClosedDiurnalLoop(
          Astro.getSunPosition.bind(Astro), activeDate, state.sunRadius, 0.32, 10
        );
        celestialGroup.add(sunTrajectoryMesh);
      }
      if (state.visibleLayers.moon) {
        moonTrajectoryMesh = createClosedDiurnalLoop(
          Astro.getMoonPosition.bind(Astro), activeDate, state.moonRadius, 0.22, 11
        );
        celestialGroup.add(moonTrajectoryMesh);
      }
      updateSeasonsBand(state.lat);
      updateMoonBand(state.lat);
      EdgePostProcessor.refreshOutlineList();
    }

    // ========== Celestial Update ==========
    function updateCelestialState() {
      const activeDate = getActiveDate();
      const sunCoord = Astro.getSunPosition(activeDate, state.lat, state.lng);
      const isSunAbove = sunCoord.altitude > 0;

      const sunPos = Astro.toCartesian(sunCoord.altitude, sunCoord.azimuth, state.sunRadius);
      sunGroup.position.copy(sunPos);
      moonShaderMat.uniforms.uSunPosition.value.copy(sunPos);

      if (state.visibleLayers.sun) {
        sunGroup.visible = true;
        sunSphere.material.color.setHex(isSunAbove ? 0xffffff : 0xd4d4d8);
        sunCorona.visible = isSunAbove;
        if (isSunAbove) {
          const shadowLen = Math.min(dialRadius, gnomonHeight / Math.tan(Math.max(3 * Astro.rad, sunCoord.altitude * Astro.rad)));
          const az = (sunCoord.azimuth + 180) * Astro.rad;
          shadowLine.geometry.setFromPoints([
            new THREE.Vector3(0, 0.06, 0),
            new THREE.Vector3(shadowLen * Math.sin(az), 0.06, -shadowLen * Math.cos(az))
          ]);
          shadowLine.visible = true;
        } else {
          shadowLine.visible = false;
        }
      } else {
        sunGroup.visible = false;
        shadowLine.visible = false;
      }

      const moonCoord = Astro.getMoonPosition(activeDate, state.lat, state.lng);
      moonGroup.position.copy(Astro.toCartesian(moonCoord.altitude, moonCoord.azimuth, state.moonRadius));
      moonGroup.visible = state.visibleLayers.moon;

      updateDashboardData(activeDate, sunCoord, moonCoord);
    }

    // ========== UI ==========
    const labelLat = document.getElementById('label-lat');
    const labelSeason = document.getElementById('label-season');
    const labelTime = document.getElementById('label-time');
    const sliderLat = document.getElementById('slider-lat');
    const sliderSeason = document.getElementById('slider-season');
    const sliderTime = document.getElementById('slider-time');
    const btnResetLat = document.getElementById('btn-reset-lat');
    const btnResetSeason = document.getElementById('btn-reset-season');
    const btnResetTime = document.getElementById('btn-reset-time');
    const btnToggleSun = document.getElementById('btn-toggle-sun');
    const btnToggleMoon = document.getElementById('btn-toggle-moon');
    const btnToggleInfo = document.getElementById('btn-toggle-info');
    const infoDashboard = document.getElementById('info-dashboard');
    const controlPanel = document.getElementById('control-panel');
    const northIndicatorHUD = document.getElementById('north-indicator-hud');
    const northArrowSvg = document.getElementById('north-arrow-svg');

    function getMoonPhaseName(fraction, age) {
      if (fraction < 0.04) return '新月 (朔)';
      if (fraction > 0.96) return '望月 (滿月)';
      if (age < 7.4) return '眉月';
      if (age < 8.8) return '上弦月';
      if (age < 14.7) return '盈凸月';
      if (age < 22.1) return '虧凸月';
      if (age < 23.5) return '下弦月';
      return '殘月';
    }

    function updateDashboardData(date, sun, moon) {
      const pad = n => String(n).padStart(2, '0');
      const y = date.getFullYear(), m = pad(date.getMonth() + 1), d = pad(date.getDate());
      const h = pad(date.getHours()), min = pad(date.getMinutes());
      document.getElementById('dash-datetime').textContent = `${y}-${m}-${d} ${h}:${min}`;

      const day = date.getDate(), month = date.getMonth() + 1;
      let term = '平氣時節';
      if ((month === 3 && day >= 19 && day <= 22) || (month === 9 && day >= 21 && day <= 24)) term = '二分帶 (春秋分)';
      else if (month === 6 && day >= 20 && day <= 23) term = '二至帶 (夏至)';
      else if (month === 12 && day >= 20 && day <= 23) term = '二至帶 (冬至)';
      document.getElementById('dash-season-term').textContent = term;

      document.getElementById('dash-sun-alt').textContent = `${sun.altitude >= 0 ? '+' : ''}${sun.altitude.toFixed(1)}°`;
      document.getElementById('dash-sun-az').textContent = `${sun.azimuth.toFixed(1)}°`;
      document.getElementById('dash-moon-alt').textContent = `${moon.altitude >= 0 ? '+' : ''}${moon.altitude.toFixed(1)}°`;
      document.getElementById('dash-moon-az').textContent = `${moon.azimuth.toFixed(1)}°`;
      document.getElementById('dash-moon-phase').textContent = getMoonPhaseName(moon.phaseFraction, moon.moonAge);
      document.getElementById('dash-lat-val').textContent = `${Math.abs(state.lat).toFixed(1)}° ${state.lat >= 0 ? 'N' : 'S'}`;

      labelLat.textContent = `${Math.abs(state.lat).toFixed(1)}° ${state.lat >= 0 ? 'N' : 'S'}`;
      labelSeason.textContent = state.seasonDayOffset === 0 ? '今日' : `${m}/${d}`;
      labelTime.textContent = `${h}:${min}`;
    }

    function updateNorthIndicatorHUD() {
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      dir.y = 0;
      dir.normalize();
      northArrowSvg.style.transform = `rotate(${Math.atan2(dir.x, -dir.z) * Astro.deg}deg)`;
    }

    let isResettingCamera = false;
    function resetCameraToNorthDefault() {
      if (isResettingCamera) return;
      isResettingCamera = true;
      const startPos = camera.position.clone();
      const targetPos = new THREE.Vector3(0, 42, 98);
      const startTarget = controls.target.clone();
      const endTarget = new THREE.Vector3(0, 0, 0);
      const t0 = performance.now();
      const duration = 800;

      function anim(t) {
        const p = Math.min(1, (t - t0) / duration);
        const ease = p < 0.5 ? 4 * p * p * p : (p - 1) * (2 * p - 2) * (2 * p - 2) + 1;
        camera.position.lerpVectors(startPos, targetPos, ease);
        controls.target.lerpVectors(startTarget, endTarget, ease);
        controls.update();
        state.cameraMoved = true;
        if (p < 1) requestAnimationFrame(anim);
        else isResettingCamera = false;
      }
      requestAnimationFrame(anim);
    }
    northIndicatorHUD.addEventListener('click', resetCameraToNorthDefault);

    // ========== Tutorial ==========
    const TutorialGuide = {
      currentStep: 0,
      totalSteps: 6,
      steps: [
        { title: '🔄 探索視角與天球位姿', desc: '在畫面上任意滑動、拖曳可旋轉觀測天球視角；滾輪或雙指可縮放距離。', target: null, action: () => closeControlPanel() },
        { title: '👆👆 喚出控制面板', desc: '在畫面上任何空白處連按兩下（Double Click / Tap），即可展開隱藏的控制面板。', target: 'control-panel', action: () => { openControlPanel(); controlPanel.classList.add('tutorial-highlight'); } },
        { title: '🎚️ 滑動觀察即時變化', desc: '拖曳緯度、時節或時間滑桿時，面板會自動切換為 5% 穿透半透明，讓你清楚直視天體動態。', target: 'control-panel', action: () => { openControlPanel(); controlPanel.classList.add('tutorial-highlight', 'panel-dragging'); setTimeout(() => controlPanel.classList.remove('panel-dragging'), 1200); } },
        { title: 'ⓘ 展開天體儀表板', desc: '點擊 ⓘ 按鈕可展開或折疊太陽高度角、方位角與月相即時天文數據儀表板。', target: 'btn-toggle-info', action: () => { openControlPanel(); infoDashboard.classList.remove('hidden'); btnToggleInfo.classList.add('bg-black', 'text-white', 'tutorial-highlight'); } },
        { title: '👆 單擊隱藏面板', desc: '在控制面板以外的空白處單擊一下，即可將面板隱藏，回歸純粹的無干擾觀測體驗。', target: null, action: () => closeControlPanel() },
        { title: '🧭 點擊指南針復位視角', desc: '點擊右上角指南針標記，天球會平滑恢復為預設視角，並自動將北方精確對齊螢幕上方！', target: 'north-indicator-hud', action: () => { northIndicatorHUD.classList.add('tutorial-highlight'); resetCameraToNorthDefault(); } }
      ],

      init() {
        const badge = document.getElementById('tut-step-badge');
        const title = document.getElementById('tut-title');
        const desc = document.getElementById('tut-desc');
        const dots = document.getElementById('tut-dots');
        const btnPrev = document.getElementById('btn-prev-tutorial');
        const btnNext = document.getElementById('btn-next-tutorial');
        const btnSkip = document.getElementById('btn-skip-tutorial');

        const render = () => {
          document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
          const s = this.steps[this.currentStep];
          badge.textContent = `步驟 ${this.currentStep + 1} / ${this.totalSteps}`;
          title.innerHTML = s.title;
          desc.textContent = s.desc;
          btnPrev.classList.toggle('hidden', this.currentStep === 0);
          btnNext.textContent = this.currentStep === this.totalSteps - 1 ? '開始體驗 ✓' : '下一步 ➔';
          dots.querySelectorAll('span').forEach((dot, i) => {
            dot.className = i === this.currentStep ? 'w-2 h-2 rounded-full bg-black scale-125 transition' : 'w-2 h-2 rounded-full bg-black/20 transition';
          });
          s.action();
          if (s.target) {
            const el = document.getElementById(s.target);
            if (el) el.classList.add('tutorial-highlight');
          }
        };

        btnNext.addEventListener('click', () => {
          if (this.currentStep < this.totalSteps - 1) { this.currentStep++; render(); }
          else this.finish();
        });
        btnPrev.addEventListener('click', () => { if (this.currentStep > 0) { this.currentStep--; render(); } });
        btnSkip.addEventListener('click', () => this.finish());
        render();
      },

      finish() {
        const modal = document.getElementById('tutorial-modal');
        modal.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
        setTimeout(() => modal.remove(), 400);
        document.querySelectorAll('.tutorial-highlight').forEach(el => el.classList.remove('tutorial-highlight'));
        closeControlPanel();
        resetCameraToNorthDefault();
      }
    };

    // ========== Panel Control ==========
    function openControlPanel() {
      state.isControlPanelOpen = true;
      state.panelOpenTime = performance.now();
      controlPanel.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
      controlPanel.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
    }
    function closeControlPanel() {
      state.isControlPanelOpen = false;
      controlPanel.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
      controlPanel.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100', 'panel-dragging');
    }

    // Double-click / double-tap to open
    window.addEventListener('dblclick', e => {
      if (controlPanel.contains(e.target) || northIndicatorHUD.contains(e.target)) return;
      openControlPanel();
    });

    let lastTapTime = 0, lastTapPos = { x: 0, y: 0 };
    window.addEventListener('touchend', e => {
      if (controlPanel.contains(e.target) || northIndicatorHUD.contains(e.target) || isDragGesture) return;
      const touch = e.changedTouches?.[0];
      if (!touch) return;
      const now = performance.now();
      const dist = Math.hypot(touch.clientX - lastTapPos.x, touch.clientY - lastTapPos.y);
      if (now - lastTapTime < 320 && dist < 30) {
        openControlPanel();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapPos = { x: touch.clientX, y: touch.clientY };
      }
    });

    // Click outside to close
    let pointerDownPos = { x: 0, y: 0 };
    let isDragGesture = false;
    window.addEventListener('pointerdown', e => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      isDragGesture = false;
    });
    window.addEventListener('pointermove', e => {
      if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 7) isDragGesture = true;
    });
    window.addEventListener('pointerup', e => {
      if (!state.isControlPanelOpen || isDragGesture || performance.now() - state.panelOpenTime < 280) return;
      if (!controlPanel.contains(e.target) && !northIndicatorHUD.contains(e.target)) closeControlPanel();
    });

    // Slider drag transparency
    [sliderLat, sliderSeason, sliderTime].forEach(s => {
      const start = () => controlPanel.classList.add('panel-dragging');
      const end = () => controlPanel.classList.remove('panel-dragging');
      s.addEventListener('mousedown', start);
      s.addEventListener('touchstart', start, { passive: true });
      s.addEventListener('mouseup', end);
      s.addEventListener('touchend', end);
    });

    // Throttled trajectory update
    let trajectoryTimer = null;
    function scheduleTrajectoryUpdate() {
      if (trajectoryTimer) return;
      trajectoryTimer = setTimeout(() => {
        trajectoryTimer = null;
        updateDiurnalTrajectories();
        updateCelestialState();
      }, 60);
    }

    sliderLat.addEventListener('input', () => {
      state.lat = parseFloat(sliderLat.value);
      scheduleTrajectoryUpdate();
    });
    sliderSeason.addEventListener('input', () => {
      state.seasonDayOffset = parseInt(sliderSeason.value, 10);
      scheduleTrajectoryUpdate();
    });
    sliderTime.addEventListener('input', () => {
      state.timeHourOffset = parseFloat(sliderTime.value);
      updateCelestialState();
    });

    btnResetLat.addEventListener('click', () => {
      state.lat = 25.0330;
      sliderLat.value = 25.0330;
      updateDiurnalTrajectories();
      updateCelestialState();
    });
    btnResetSeason.addEventListener('click', () => {
      state.seasonDayOffset = 0;
      sliderSeason.value = 0;
      updateDiurnalTrajectories();
      updateCelestialState();
    });
    btnResetTime.addEventListener('click', () => {
      state.timeHourOffset = 0;
      sliderTime.value = 0;
      updateCelestialState();
    });

    function setToggleStyle(btn, active) {
      btn.className = active
        ? 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border-2 border-black text-xs font-bold transition bg-black text-white'
        : 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border-2 border-black/40 text-xs font-bold transition bg-white text-black/40';
    }

    btnToggleSun.addEventListener('click', () => {
      state.visibleLayers.sun = !state.visibleLayers.sun;
      setToggleStyle(btnToggleSun, state.visibleLayers.sun);
      updateDiurnalTrajectories();
      updateCelestialState();
    });
    btnToggleMoon.addEventListener('click', () => {
      state.visibleLayers.moon = !state.visibleLayers.moon;
      setToggleStyle(btnToggleMoon, state.visibleLayers.moon);
      updateDiurnalTrajectories();
      updateCelestialState();
    });
    btnToggleInfo.addEventListener('click', () => {
      infoDashboard.classList.toggle('hidden');
      btnToggleInfo.classList.toggle('bg-black', !infoDashboard.classList.contains('hidden'));
      btnToggleInfo.classList.toggle('text-white', !infoDashboard.classList.contains('hidden'));
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      EdgePostProcessor.resize(w, h, Math.min(window.devicePixelRatio, 2));
    });

    // Periodic time sync
    setInterval(() => {
      state.baseDate = new Date();
      updateCelestialState();
    }, 1000);

    // ========== Boot ==========
    window.onload = () => {
      state.baseDate = new Date();
      EdgePostProcessor.init(window.innerWidth, window.innerHeight, Math.min(window.devicePixelRatio, 2));
      updateDiurnalTrajectories();
      updateCelestialState();
      TutorialGuide.init();

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        if (state.cameraMoved) {
          sunCorona.lookAt(camera.position);
          updateNorthIndicatorHUD();
          state.cameraMoved = false;
        }
        EdgePostProcessor.render();
      }
      animate();
    };
  </script>
</body>
</html>
