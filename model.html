<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逆向日晷 - 全天球包絡帶與完整周日軌道模擬器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .panel-glass {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .panel-glass-dark {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas {
      outline: none;
      display: block;
    }
  </style>
</head>
<body id="body-root" class="bg-slate-100 text-slate-800 font-sans h-screen w-screen flex flex-col antialiased overflow-hidden select-none transition-colors duration-500">

  <div class="flex-1 relative w-full h-full overflow-hidden">
    
    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Hidden by default, toggled via Double Click on canvas background -->
    <div id="control-panel" class="hidden absolute top-4 left-4 w-72 sm:w-80 panel-glass rounded-2xl p-4 z-20 space-y-3.5 transition-all duration-300 shadow-xl">
      
      <!-- Panel Header -->
      <div class="flex items-center justify-between pb-2 border-b border-slate-200/80">
        <div class="flex items-center space-x-2">
          <span class="text-amber-600 font-bold text-xs">⚙️</span>
          <h2 class="font-bold text-slate-900 text-xs tracking-wider">控制面板</h2>
        </div>
        <button id="btn-close-panel" class="text-slate-400 hover:text-slate-600 text-xs font-bold px-1.5 py-0.5 rounded transition">✕</button>
      </div>

      <!-- 1. Celestial Independent Toggles (Sun & Moon 4 combinations) -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">天體顯示控制</label>
        <div class="grid grid-cols-2 gap-2 text-xs font-medium">
          <button id="btn-toggle-sun" class="toggle-btn active py-2 px-3 rounded-xl bg-amber-600 text-white transition flex items-center justify-center gap-1.5 shadow-sm">
            <span>☀️</span>
            <span>太陽軌跡</span>
          </button>
          <button id="btn-toggle-moon" class="toggle-btn active py-2 px-3 rounded-xl bg-cyan-600 text-white transition flex items-center justify-center gap-1.5 shadow-sm">
            <span>🌙</span>
            <span>月亮軌跡</span>
          </button>
        </div>
      </div>

      <!-- 2. Latitude, Season & Time Controls -->
      <div class="pt-2.5 border-t border-slate-200/80 space-y-3">
        <!-- Latitude Slider -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-600">觀測地緯度：</span>
            <span id="slider-lat-val" class="font-mono text-amber-700 font-bold">23.5°N</span>
          </div>
          <input type="range" id="slider-latitude" min="-60" max="66" step="0.5" value="23.5" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-amber-600">
        </div>

        <!-- Season / Month Slider (1 to 12) -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-600">季節月份 (全年):</span>
            <span id="slider-season-val" class="font-mono text-amber-700 font-bold">9月 (秋分前後)</span>
          </div>
          <input type="range" id="slider-season" min="1" max="12" step="0.1" value="9.0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-amber-600">
        </div>

        <!-- Time Simulation Slider -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-600">時間快進：</span>
            <span id="slider-time-val" class="font-mono text-amber-700 font-bold">15:32</span>
          </div>
          <input type="range" id="slider-time" min="0" max="24" step="0.1" value="15.53" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-amber-600">
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button id="btn-now-time" class="py-1.5 rounded-lg bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-xs font-semibold transition shadow-xs">
            📅 當前時間
          </button>
          <button id="btn-toggle-play" class="py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center justify-center space-x-1 transition shadow-sm">
            <span id="play-icon">▶</span>
            <span id="play-text">播放動態</span>
          </button>
        </div>
      </div>

      <div class="pt-2 border-t border-slate-200/80 flex justify-between items-center text-[11px] text-slate-400">
        <span>提示：雙擊畫面空白處可收合面板</span>
        <button id="btn-reset-view" class="text-amber-600 hover:underline font-semibold">重設視角</button>
      </div>

    </div>

  </div>

  <script>
    const R_SUN = 28.0;   // Sun celestial sphere radius
    const R_MOON = 26.0;  // Moon celestial sphere radius

    const now = new Date();
    const currentHourDecimal = now.getHours() + now.getMinutes() / 60;
    const isDaytime = currentHourDecimal >= 6 && currentHourDecimal < 18;

    const AppState = {
      latitude: 23.5,
      seasonMonth: 9.0, // 1 to 12
      showSun: true,
      showMoon: true,
      timeDecimal: currentHourDecimal,
      isDaytime: isDaytime,
      animating: false,
    };

    const container = document.getElementById('canvas-container');
    let scene, camera, renderer, controls;
    let celestialGroup;
    let sunMesh, sunLight, moonMesh, moonLight;
    let projectionLinesGroup;

    function applyThemeColors() {
      const body = document.getElementById('body-root');
      const panel = document.getElementById('control-panel');

      if (AppState.isDaytime) {
        body.className = "bg-slate-100 text-slate-800 font-sans h-screen w-screen flex flex-col antialiased overflow-hidden select-none transition-colors duration-500";
        panel.className = panel.className.replace('panel-glass-dark', 'panel-glass');
        if (!panel.classList.contains('panel-glass')) panel.classList.add('panel-glass');
        
        if (scene) {
          scene.background = new THREE.Color(0xf0f4f8);
          scene.fog = new THREE.FogExp2(0xf0f4f8, 0.002);
        }
      } else {
        body.className = "bg-slate-950 text-slate-100 font-sans h-screen w-screen flex flex-col antialiased overflow-hidden select-none transition-colors duration-500";
        panel.className = panel.className.replace('panel-glass', 'panel-glass-dark');
        if (!panel.classList.contains('panel-glass-dark')) panel.classList.add('panel-glass-dark');
        
        if (scene) {
          scene.background = new THREE.Color(0x020617);
          scene.fog = new THREE.FogExp2(0x020617, 0.002);
        }
      }
    }

    function init3D() {
      scene = new THREE.Scene();
      applyThemeColors();

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.5, 300);
      camera.position.set(45, 32, 50);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 + 0.3;
      controls.minDistance = 15;
      controls.maxDistance = 120;
      controls.target.set(0, 0, 0);

      const ambientLight = new THREE.AmbientLight(0xffffff, AppState.isDaytime ? 0.85 : 0.4);
      scene.add(ambientLight);

      buildFullCelestialSphere();

      celestialGroup = new THREE.Group();
      scene.add(celestialGroup);

      projectionLinesGroup = new THREE.Group();
      scene.add(projectionLinesGroup);

      rebuildSceneContent();
      createCelestialObjects();

      animate();
    }

    function buildFullCelestialSphere() {
      const sphereGeo = new THREE.SphereGeometry(R_SUN + 1.0, 36, 36);
      const sphereMat = new THREE.MeshBasicMaterial({ 
        color: AppState.isDaytime ? 0x94a3b8 : 0x334155, 
        transparent: true, 
        opacity: 0.03,
        side: THREE.BackSide,
        depthWrite: false
      });
      scene.add(new THREE.Mesh(sphereGeo, sphereMat));

      const groundGeo = new THREE.CircleGeometry(R_SUN + 1.5, 64);
      const groundMat = new THREE.MeshStandardMaterial({
        color: AppState.isDaytime ? 0xe2e8f0 : 0x1e293b,
        roughness: 0.8,
        metalness: 0.1,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85
      });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      scene.add(groundMesh);

      const rimGeo = new THREE.RingGeometry(R_SUN + 1.3, R_SUN + 1.7, 64);
      const rimMat = new THREE.MeshBasicMaterial({ color: AppState.isDaytime ? 0x64748b : 0x475569, side: THREE.DoubleSide });
      const rimMesh = new THREE.Mesh(rimGeo, rimMat);
      rimMesh.rotation.x = -Math.PI / 2;
      rimMesh.position.y = 0.02;
      scene.add(rimMesh);

      const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -(R_SUN + 2), 0), new THREE.Vector3(0, R_SUN + 2, 0)]);
      const axisLine = new THREE.Line(axisGeo, new THREE.LineDashedMaterial({ color: 0x64748b, dashSize: 1, gapSize: 0.6 }));
      axisLine.computeLineDistances();
      scene.add(axisLine);

      const obsGroup = new THREE.Group();
      const bodyMat = new THREE.MeshBasicMaterial({ color: AppState.isDaytime ? 0x334155 : 0x94a3b8 });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), bodyMat);
      head.position.y = 0.4;
      obsGroup.add(head);

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8), bodyMat);
      torso.position.y = -0.1;
      obsGroup.add(torso);
      scene.add(obsGroup);
    }

    function celestialToHorizontal(declination, hourAngle, phiRad, radius) {
      const sinA = Math.sin(phiRad) * Math.sin(declination) +
                   Math.cos(phiRad) * Math.cos(declination) * Math.cos(hourAngle);
      const altitude = Math.asin(Math.max(-1, Math.min(1, sinA)));

      const cosA = Math.cos(altitude);
      const sinAz = (-Math.cos(declination) * Math.sin(hourAngle)) / (cosA || 0.0001);
      const cosAz = (Math.cos(phiRad) * Math.sin(declination) -
                     Math.sin(phiRad) * Math.cos(declination) * Math.cos(hourAngle)) / (cosA || 0.0001);
      
      let azimuth = Math.atan2(sinAz, cosAz);
      if (azimuth < 0) azimuth += Math.PI * 2;

      return {
        x: radius * cosA * Math.sin(azimuth),
        y: radius * Math.sin(altitude),
        z: -radius * cosA * Math.cos(azimuth),
        altitude, azimuth
      };
    }

    function createFullDiurnalArc(declination, phiRad, colorHex, radius) {
      const abovePoints = [];
      const belowPoints = [];
      const steps = 150;

      for (let i = 0; i <= steps; i++) {
        const H = -Math.PI + (i / steps) * (Math.PI * 2);
        const pt = celestialToHorizontal(declination, H, phiRad, radius);
        if (pt) {
          const vec = new THREE.Vector3(pt.x, pt.y, pt.z);
          if (pt.altitude >= 0) {
            abovePoints.push(vec);
          } else {
            belowPoints.push(vec);
          }
        }
      }

      const arcGroup = new THREE.Group();

      if (abovePoints.length >= 2) {
        const geoAbove = new THREE.BufferGeometry().setFromPoints(abovePoints);
        const matAbove = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3, transparent: true, opacity: 0.95 });
        arcGroup.add(new THREE.Line(geoAbove, matAbove));
      }

      if (belowPoints.length >= 2) {
        const geoBelow = new THREE.BufferGeometry().setFromPoints(belowPoints);
        const matBelow = new THREE.LineDashedMaterial({ color: colorHex, dashSize: 0.8, gapSize: 0.8, transparent: true, opacity: 0.35 });
        const belowLine = new THREE.Line(geoBelow, matBelow);
        belowLine.computeLineDistances();
        arcGroup.add(belowLine);
      }

      return arcGroup;
    }

    function buildContinuousEnvelopeBelt(minDec, maxDec, phiRad, colorHex, radius) {
      const decSteps = 16;
      const hSteps = 80;
      const vertices = [];
      const indices = [];

      for (let i = 0; i <= decSteps; i++) {
        const dec = minDec + (i / decSteps) * (maxDec - minDec);
        for (let j = 0; j <= hSteps; j++) {
          const H = -Math.PI + (j / hSteps) * (Math.PI * 2);
          const pt = celestialToHorizontal(dec, H, phiRad, radius);
          if (pt) {
            vertices.push(pt.x, pt.y, pt.z);
          } else {
            vertices.push(0, 0, 0);
          }
        }
      }

      for (let i = 0; i < decSteps; i++) {
        for (let j = 0; j < hSteps; j++) {
          const a = i * (hSteps + 1) + j;
          const b = (i + 1) * (hSteps + 1) + j;
          const c = (i + 1) * (hSteps + 1) + (j + 1);
          const d = i * (hSteps + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mat = new THREE.MeshBasicMaterial({ 
        color: colorHex, 
        transparent: true, 
        opacity: 0.12, 
        side: THREE.DoubleSide, 
        depthWrite: false 
      });
      return new THREE.Mesh(geo, mat);
    }

    // Convert month (1.0 to 12.0) to solar declination (-23.44° to +23.44°)
    function monthToDeclination(month) {
      const obliquity = 23.44 * (Math.PI / 180);
      // Month 12/1 (Winter Solstice) -> -obliquity
      // Month 3/4 (Equinox) -> 0
      // Month 6/7 (Summer Solstice) -> +obliquity
      // Using cosine wave: dec = -obliquity * cos(2 * PI * (month - 1) / 12)
      return -obliquity * Math.cos(2 * Math.PI * (month - 1) / 12);
    }

    function getMonthName(month) {
      const m = Math.round(month);
      const names = {
        1: '1月 (冬至後)', 2: '2月', 3: '3月 (春分)', 4: '4月',
        5: '5月', 6: '6月 (夏至)', 7: '7月', 8: '8月',
        9: '9月 (秋分)', 10: '10月', 11: '11月', 12: '12月 (冬至)'
      };
      return names[((m - 1) % 12) + 1] || `${m}月`;
    }

    function rebuildSceneContent() {
      while (celestialGroup.children.length > 0) {
        const obj = celestialGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        celestialGroup.remove(obj);
      }

      const phiRad = (AppState.latitude * Math.PI) / 180;
      const obliquity = 23.44 * (Math.PI / 180);
      const currentDec = monthToDeclination(AppState.seasonMonth);

      // 1. Sun Full Celestial Envelope & Active Trace based on Season Slider
      if (AppState.showSun) {
        const sunEnvelope = buildContinuousEnvelopeBelt(-obliquity, obliquity, phiRad, 0xf59e0b, R_SUN);
        if (sunEnvelope) celestialGroup.add(sunEnvelope);

        const sunArc = createFullDiurnalArc(currentDec, phiRad, 0xf59e0b, R_SUN);
        if (sunArc) celestialGroup.add(sunArc);
      }

      // 2. Moon Full Celestial Envelope & Active Trace (Moon follows seasonal regression or similar declination offset)
      if (AppState.showMoon) {
        const moonMaxDec = 28.5 * (Math.PI / 180);
        const moonEnvelope = buildContinuousEnvelopeBelt(-moonMaxDec, moonMaxDec, phiRad, 0x06b6d4, R_MOON);
        if (moonEnvelope) celestialGroup.add(moonEnvelope);

        const moonDec = Math.max(-moonMaxDec, Math.min(moonMaxDec, currentDec * 1.15 + 0.1));
        const moonArc = createFullDiurnalArc(moonDec, phiRad, 0x06b6d4, R_MOON);
        if (moonArc) celestialGroup.add(moonArc);
      }
    }

    function createCelestialObjects() {
      const sunGeo = new THREE.SphereGeometry(1.5, 32, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      sunMesh = new THREE.Mesh(sunGeo, sunMat);
      scene.add(sunMesh);

      sunLight = new THREE.PointLight(0xffedd5, 1.2, 40);
      scene.add(sunLight);

      const moonGeo = new THREE.SphereGeometry(1.3, 32, 32);
      const moonMat = new THREE.MeshStandardMaterial({ color: 0xccfbf1, emissive: 0x22d3ee, emissiveIntensity: 0.5, roughness: 0.6 });
      moonMesh = new THREE.Mesh(moonGeo, moonMat);
      scene.add(moonMesh);

      moonLight = new THREE.PointLight(0xa5f3fc, 0.8, 35);
      scene.add(moonLight);

      updateCelestialPositions();
    }

    function updateCelestialPositions() {
      if (!sunMesh || !moonMesh) return;
      const phiRad = (AppState.latitude * Math.PI) / 180;
      const hourAngle = ((AppState.timeDecimal - 12) / 12) * Math.PI;
      const obliquity = 23.44 * (Math.PI / 180);
      const currentDec = monthToDeclination(AppState.seasonMonth);

      while (projectionLinesGroup.children.length > 0) {
        const obj = projectionLinesGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        projectionLinesGroup.remove(obj);
      }

      // Sun position
      const sunPt = celestialToHorizontal(currentDec, hourAngle, phiRad, R_SUN);
      if (sunPt && AppState.showSun) {
        sunMesh.visible = true;
        sunLight.visible = (sunPt.altitude >= 0);
        sunMesh.position.set(sunPt.x, sunPt.y, sunPt.z);
        sunLight.position.set(sunPt.x, sunPt.y, sunPt.z);

        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(sunPt.x, sunPt.y, sunPt.z)
        ]);
        const lineMat = new THREE.LineDashedMaterial({ color: 0xf59e0b, dashSize: 0.8, gapSize: 0.4, transparent: true, opacity: sunPt.altitude >= 0 ? 0.8 : 0.2 });
        const projLine = new THREE.Line(lineGeo, lineMat);
        projLine.computeLineDistances();
        projectionLinesGroup.add(projLine);
      } else {
        sunMesh.visible = false;
        sunLight.visible = false;
      }

      // Moon position
      const moonMaxDec = 28.5 * (Math.PI / 180);
      const moonDec = Math.max(-moonMaxDec, Math.min(moonMaxDec, currentDec * 1.15 + 0.1));
      const moonHourAngle = hourAngle + Math.PI * 0.85;
      const moonPt = celestialToHorizontal(moonDec, moonHourAngle, phiRad, R_MOON);
      if (moonPt && AppState.showMoon) {
        moonMesh.visible = true;
        moonLight.visible = (moonPt.altitude >= 0);
        moonMesh.position.set(moonPt.x, moonPt.y, moonPt.z);
        moonLight.position.set(moonPt.x, moonPt.y, moonPt.z);

        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(moonPt.x, moonPt.y, moonPt.z)
        ]);
        const lineMat = new THREE.LineDashedMaterial({ color: 0x06b6d4, dashSize: 0.8, gapSize: 0.4, transparent: true, opacity: moonPt.altitude >= 0 ? 0.8 : 0.2 });
        const projLine = new THREE.Line(lineGeo, lineMat);
        projLine.computeLineDistances();
        projectionLinesGroup.add(projLine);
      } else {
        moonMesh.visible = false;
        moonLight.visible = false;
      }

      const hr = Math.floor(AppState.timeDecimal);
      const mn = Math.floor((AppState.timeDecimal - hr) * 60);
      const timeStr = `${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
      document.getElementById('slider-time-val').textContent = `${timeStr}`;
      document.getElementById('slider-season-val').textContent = getMonthName(AppState.seasonMonth);

      const isCurrentlyDay = hr >= 6 && hr < 18;
      if (isCurrentlyDay !== AppState.isDaytime) {
        AppState.isDaytime = isCurrentlyDay;
        applyThemeColors();
      }
    }

    function setupUIEvents() {
      const btnSun = document.getElementById('btn-toggle-sun');
      btnSun.addEventListener('click', () => {
        AppState.showSun = !AppState.showSun;
        btnSun.classList.toggle('bg-amber-600', AppState.showSun);
        btnSun.classList.toggle('bg-slate-200', !AppState.showSun);
        btnSun.classList.toggle('text-white', AppState.showSun);
        btnSun.classList.toggle('text-slate-600', !AppState.showSun);
        rebuildSceneContent();
        updateCelestialPositions();
      });

      const btnMoon = document.getElementById('btn-toggle-moon');
      btnMoon.addEventListener('click', () => {
        AppState.showMoon = !AppState.showMoon;
        btnMoon.classList.toggle('bg-cyan-600', AppState.showMoon);
        btnMoon.classList.toggle('bg-slate-200', !AppState.showMoon);
        btnMoon.classList.toggle('text-white', AppState.showMoon);
        btnMoon.classList.toggle('text-slate-600', !AppState.showMoon);
        rebuildSceneContent();
        updateCelestialPositions();
      });

      document.getElementById('slider-latitude').addEventListener('input', (e) => {
        AppState.latitude = parseFloat(e.target.value);
        document.getElementById('slider-lat-val').textContent = `${AppState.latitude.toFixed(1)}°N`;
        rebuildSceneContent();
        updateCelestialPositions();
      });

      document.getElementById('slider-season').addEventListener('input', (e) => {
        AppState.seasonMonth = parseFloat(e.target.value);
        rebuildSceneContent();
        updateCelestialPositions();
      });

      document.getElementById('slider-time').addEventListener('input', (e) => {
        AppState.timeDecimal = parseFloat(e.target.value);
        updateCelestialPositions();
      });

      document.getElementById('btn-now-time').addEventListener('click', () => {
        const cur = new Date();
        AppState.timeDecimal = cur.getHours() + cur.getMinutes() / 60;
        document.getElementById('slider-time').value = AppState.timeDecimal;
        updateCelestialPositions();
      });

      const playBtn = document.getElementById('btn-toggle-play');
      playBtn.addEventListener('click', () => {
        AppState.animating = !AppState.animating;
        document.getElementById('play-icon').textContent = AppState.animating ? '⏸' : '▶';
        document.getElementById('play-text').textContent = AppState.animating ? '暫停' : '播放動態';
        playBtn.classList.toggle('bg-amber-600', AppState.animating);
        playBtn.classList.toggle('bg-emerald-600', !AppState.animating);
      });

      document.getElementById('btn-reset-view').addEventListener('click', () => {
        camera.position.set(45, 32, 50);
        controls.target.set(0, 0, 0);
      });

      const panel = document.getElementById('control-panel');
      const closeBtn = document.getElementById('btn-close-panel');

      function togglePanel() {
        panel.classList.toggle('hidden');
      }

      container.addEventListener('dblclick', togglePanel);
      closeBtn.addEventListener('click', togglePanel);

      const resizeObserver = new ResizeObserver(() => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
      resizeObserver.observe(container);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (AppState.animating) {
        AppState.timeDecimal += 0.03;
        if (AppState.timeDecimal >= 24) AppState.timeDecimal = 0;
        document.getElementById('slider-time').value = AppState.timeDecimal;
        updateCelestialPositions();
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('slider-time').value = AppState.timeDecimal;
      document.getElementById('slider-season').value = AppState.seasonMonth;
      init3D();
      setupUIEvents();
    });
  </script>
</body>
</html>
